[alembic]
# Path to migration scripts, relative to this file (backend/).
script_location = alembic
path_separator = os
# Make `backend.app...` importable when running the CLI from backend/
# (repo root on sys.path via "..").
prepend_sys_path = . ..

# Fallback URL; the app, the tests and CI always set NEXUS_DATABASE_URL,
# which takes precedence in alembic/env.py.
sqlalchemy.url = sqlite:///./nexus.db

[alembic:exclude]
# Intentionally no [logging] sections: alembic/env.py does not call
# fileConfig(), so the CLI works with this minimal file.

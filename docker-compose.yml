# NEXUS AGENT OS — local stack.
#
# Brings up the three runtime services together:
#   * backend      — FastAPI (health on http://localhost:8000/health)
#   * bridge       — Local Browser Bridge (internal only, never published)
#   * frontend     — nginx serving the static app and proxying /api + /ws
#
# Usage:
#   docker compose up --build
#   docker compose up -d
#
# Environment variables are documented in .env.example (no real values).

name: nexus-agent-os

services:
  backend:
    build:
      dockerfile: infrastructure/docker/Dockerfile.backend
      context: ./backend
    image: nexus-agent-os-backend
    container_name: nexus-backend
    env_file:
      - .env
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - internal

  bridge:
    build:
      dockerfile: infrastructure/docker/Dockerfile.bridge
      context: ./integrations/browser-bridge
    image: nexus-agent-os-bridge
    container_name: nexus-bridge
    env_file:
      - .env
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      # Reachable by the backend over the internal network only.
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "8765"
    expose:
      - "8765"
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      dockerfile: infrastructure/docker/Dockerfile.frontend
      context: ./frontend
    image: nexus-agent-os-frontend
    container_name: nexus-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      bridge:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal
      - frontend

networks:
  internal:
    driver: bridge
  frontend:
    driver: bridge

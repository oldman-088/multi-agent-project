# docker-compose.yml -- the NEXUS AGENT OS local stack (docs/SPEC.md section 10).
#
#   docker compose up --build
#
# Services
#   backend         FastAPI API, migrations applied on start
#   frontend        built web application served by nginx, proxies /api and /ws
#   browser-bridge  Local Browser Bridge used by the userscript
#
# Every published port is bound to 127.0.0.1, so the stack is reachable from
# this machine only.  All variables below are documented in .env.example and
# have a safe default, so the stack also starts without a .env file.
#
# The bridge shares the network namespace of the backend service
# (`network_mode: service:backend`).  That keeps the backend's own
# loopback-only configuration valid (the backend refuses any bridge host that
# is not 127.0.0.1) and lets the same port serve the userscript on the host
# and the backend inside the container.  The bridge port is therefore
# published by the backend service.

name: nexus-agent-os

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "127.0.0.1:${NEXUS_BACKEND_PORT:-8000}:8000"
      # The bridge listens in this network namespace, so the backend service
      # publishes its port for the userscript running in the owner's browser.
      - "127.0.0.1:${NEXUS_BRIDGE_PORT:-8790}:${NEXUS_BRIDGE_PORT:-8790}"
    environment:
      NEXUS_ENV: "${NEXUS_ENV:-development}"
      NEXUS_LOG_LEVEL: "${NEXUS_LOG_LEVEL:-INFO}"
      # Always the named volume inside the container.  NEXUS_DATABASE_URL in
      # .env applies to host runs; override it here for an external database.
      NEXUS_DATABASE_URL: "${NEXUS_COMPOSE_DATABASE_URL:-sqlite+aiosqlite:////data/nexus.db}"
      NEXUS_DB_ECHO: "${NEXUS_DB_ECHO:-false}"
      NEXUS_JWT_SECRET: "${NEXUS_JWT_SECRET:-}"
      NEXUS_JWT_ALGORITHM: "${NEXUS_JWT_ALGORITHM:-HS256}"
      NEXUS_ACCESS_TOKEN_TTL_SECONDS: "${NEXUS_ACCESS_TOKEN_TTL_SECONDS:-3600}"
      NEXUS_REFRESH_TOKEN_TTL_SECONDS: "${NEXUS_REFRESH_TOKEN_TTL_SECONDS:-2592000}"
      NEXUS_MAX_FAILED_LOGINS: "${NEXUS_MAX_FAILED_LOGINS:-5}"
      NEXUS_LOCKOUT_SECONDS: "${NEXUS_LOCKOUT_SECONDS:-300}"
      NEXUS_ENCRYPTION_KEY: "${NEXUS_ENCRYPTION_KEY:-}"
      # The bridge runs in the network namespace of this service, so the
      # backend reaches it on its own loopback address.
      NEXUS_BRIDGE_HOST: "127.0.0.1"
      NEXUS_BRIDGE_PORT: "${NEXUS_BRIDGE_PORT:-8790}"
      NEXUS_BRIDGE_ALLOWED_ORIGINS: "${NEXUS_BRIDGE_ALLOWED_ORIGINS:-}"
      NEXUS_OPENAI_ENABLED: "${NEXUS_OPENAI_ENABLED:-false}"
      NEXUS_OPENAI_BASE_URL: "${NEXUS_OPENAI_BASE_URL:-}"
      NEXUS_OPENAI_API_KEY_REF: "${NEXUS_OPENAI_API_KEY_REF:-}"
      NEXUS_OLLAMA_BASE_URL: "${NEXUS_OLLAMA_BASE_URL:-http://127.0.0.1:11434}"
    volumes:
      - backend-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:${NEXUS_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  browser-bridge:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.bridge
    # Shared network namespace: the bridge binds the loopback address of the
    # backend container and is published by the backend service above.
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BRIDGE_PORT: "${NEXUS_BRIDGE_PORT:-8790}"
      # Inside the container namespace the bridge has to listen on all
      # addresses; the published port stays bound to 127.0.0.1 on the host.
      BRIDGE_BIND_HOST: "${NEXUS_BRIDGE_BIND_HOST:-0.0.0.0}"
      BRIDGE_ALLOWED_ORIGINS: "${NEXUS_BRIDGE_ALLOWED_ORIGINS:-}"
      BRIDGE_API_TOKEN: "${NEXUS_BRIDGE_API_TOKEN:-}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('BRIDGE_PORT', '8790') + '/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  backend-data:

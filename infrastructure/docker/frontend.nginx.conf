# nginx configuration for the NEXUS web application.
#
# The browser only ever talks to this origin: the static bundle is served from
# / and every API call is proxied to the backend service.  That keeps the
# frontend code on relative URLs (`/api/...`, `/ws/...`) as required by
# AGENTS.md and avoids CORS entirely.
#
# The upstream is the compose service name, never localhost: `localhost` would
# point at the nginx container itself.

upstream nexus_backend {
    server backend:8000;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container health endpoint (the application health check lives on the
    # backend service).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API of the backend.
    location /api/ {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket stream of the backend (event bus).
    location /ws {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Static assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page application: every unknown path is handled by the router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

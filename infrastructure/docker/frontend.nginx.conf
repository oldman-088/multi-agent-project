# frontend.nginx.conf — replaces the stock /etc/nginx/conf.d/default.conf.
#
# Serves the built SPA from /usr/share/nginx/html and keeps the frontend's
# same-origin URL contract (AGENTS.md frontend rules): relative /api/ and /ws/
# calls are proxied to the backend service on the compose network.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; re-resolve `backend` so a container restart does
    # not leave nginx pointing at a stale address. The variable in proxy_pass
    # forces per-request resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Health endpoint of the SPA server itself (compose healthcheck uses /).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        set $backend_url http://backend:8000;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        set $backend_url http://backend:8000;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: unknown paths render index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

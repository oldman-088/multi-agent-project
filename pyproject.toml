[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent-os"
version = "0.1.0"
description = "NEXUS AGENT OS — local-first AI agent team platform (backend + conformance test slice)"
readme = "docs/SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema>=4.21",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
# docs/SPEC.md §9 scope note: mypy strict here covers the security-critical
# packages (app/core = config/auth/crypto, app/tools = Tool Gateway). The full
# §9 scope (runtimes, connections, bridge) does not exist yet; widening the
# file list is intentionally left until those slices land.
files = ["backend/app/core", "backend/app/tools"]
explicit_package_bases = true
mypy_path = "."
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

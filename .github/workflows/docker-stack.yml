name: docker-stack

# Validation of the local runtime environment: the compose file, the service
# images and the health endpoints of the running stack.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-stack:
    name: Build and start the local stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml jsonschema

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Run the static validation tests
        run: python -m pytest tests/test_docker_stack.py -q

      - name: Provide the application sources
        run: python tests/fixtures/dockerstack/install_fixtures.py

      - name: Build and start the stack
        run: docker compose up --build --detach

      - name: Wait for the health endpoints
        run: |
          set -eu
          backend_port="${NEXUS_BACKEND_PORT:-8000}"
          frontend_port="${NEXUS_FRONTEND_PORT:-3000}"
          bridge_port="${NEXUS_BRIDGE_PORT:-8790}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "http://127.0.0.1:${backend_port}/health" > /dev/null \
              && curl --fail --silent --show-error "http://127.0.0.1:${bridge_port}/health" > /dev/null \
              && curl --fail --silent --show-error "http://127.0.0.1:${frontend_port}/healthz" > /dev/null; then
              echo "the stack is healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Show the running services
        run: docker compose ps

      - name: Show the logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear the stack down
        if: always()
        run: docker compose down --volumes

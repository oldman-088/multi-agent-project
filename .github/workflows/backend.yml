name: backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "scripts/check.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "scripts/check.sh"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: lint + type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/backend[test]"
      - name: ruff check
        working-directory: apps/backend
        run: ruff check app tests
      - name: ruff format --check
        working-directory: apps/backend
        run: ruff format --check app tests
      - name: mypy
        working-directory: apps/backend
        run: mypy app

  test-sqlite:
    name: pytest (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/backend[test]"
      - name: Tests
        env:
          NEXUS_ENV: test
        working-directory: apps/backend
        run: pytest tests -q --maxfail=1

  test-postgres:
    name: pytest (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci_only
          POSTGRES_DB: nexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:nexus_ci_only@127.0.0.1:5432/nexus_ci
      NEXUS_TEST_POSTGRES_URL: postgresql+asyncpg://nexus:nexus_ci_only@127.0.0.1:5432/nexus_ci
      NEXUS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/backend[test]"
      - name: Migrations on an empty PostgreSQL database
        working-directory: apps/backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Drop the migrated schema so the suite starts empty
        working-directory: apps/backend
        run: alembic downgrade base
      - name: Tests against PostgreSQL
        working-directory: apps/backend
        run: pytest tests -q --maxfail=1

  migrations-sqlite:
    name: migrations (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/backend[test]"
      - name: upgrade / downgrade / upgrade on an empty SQLite database
        working-directory: apps/backend
        env:
          NEXUS_DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

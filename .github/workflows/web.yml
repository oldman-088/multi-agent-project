name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "tests/a11y/**"
      - "docs/screenshots/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "tests/a11y/**"
      - "docs/screenshots/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  i18n-and-unit:
    name: i18n completeness + type check + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check (app + node configs)
        run: npm run typecheck

      - name: Translation completeness (ar, en, fa) — fails on a missing key
        run: npm run i18n:check

      - name: Unit tests (jsdom)
        run: npm run test:unit

      - name: Production build
        run: npm run build

  a11y:
    name: axe accessibility + RTL/LTR screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: axe checks, direction assertions and screenshots
        run: npm run test:a11y

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-screenshots
          path: docs/screenshots/a11y
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/a11y
          if-no-files-found: ignore

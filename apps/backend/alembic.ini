# Alembic configuration for the orchestration slice's migration chain
# (apps/backend/migrations).  This chain owns only the workflow-engine tables;
# the platform schema (users, organizations, …) belongs to the backend slice
# and its own Alembic chain.  The two chains use different version tables (see
# migrations/env.py) so they can share one database.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

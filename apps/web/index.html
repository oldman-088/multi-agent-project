<!doctype html>
<!-- Arabic is the default language (Section 8.2): lang/dir start as ar/rtl and
     are kept in sync by src/i18n at runtime. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme/language before first paint to avoid a flash of
      // the wrong direction or theme (mirrors src/lib/theme.ts and src/i18n).
      (function () {
        try {
          var theme = localStorage.getItem('nx.theme');
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
          var lang = localStorage.getItem('nx.lang');
          if (lang === 'ar' || lang === 'en' || lang === 'fa') {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
          }
        } catch (e) {
          // Storage unavailable: keep the markup defaults (ar/rtl, dark).
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
